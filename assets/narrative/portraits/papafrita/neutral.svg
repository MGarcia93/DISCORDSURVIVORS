<svg xmlns="http://www.w3.org/2000/svg" width="552" height="714" viewBox="-12 -38 184 238" shape-rendering="crispEdges" data-expression="neutral">
  <title>Papafrita — neutral</title>
  <desc>Draft three's full-cheeked face, double chin and neck proportions are restored. The requested ponytail is retained. Only the armoured body is enlarged: fifteen percent wider and eight percent taller about the bottom crop, keeping its existing plates, trim and shoulder design together. The head and neck are outside this body transformation. Extra canvas room holds the creature and wider body without shrinking the face. Cinematic art only.</desc>
