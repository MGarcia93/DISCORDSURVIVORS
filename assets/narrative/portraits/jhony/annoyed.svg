  <title>Jhony — annoyed</title>
  <desc>Metalhead survivor with swept-back long black hair, clear rectangular glasses, an elongated face and pointed beard. Torn black leather jacket with red lining, white tank top and blood splashes. Exactly one silver hoop on his right lower lip, on the viewer's left; no ear or nose jewelry.</desc>
